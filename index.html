<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="author" content="Maria Eduarda de Paula Brito" />
    <!-- Título, descrição, canonical, Open Graph, Twitter e JSON-LD: scripts/seoPlugin.ts
         escreve este bloco por rota a partir de src/data/seo.ts. -->
    <!-- seo:head -->
    <!-- /seo:head -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Aplica o tema salvo antes do primeiro desenho, evitando o flash do tema errado.
      try {
        var theme = localStorage.getItem('portfolio-theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme);
        if (localStorage.getItem('portfolio-lang') === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- seo:body --><!-- /seo:body -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
